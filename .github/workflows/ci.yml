name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & test
    # macos-15 ships Xcode 16 / Swift 6. The package declares
    # swift-tools-version 6.0, which Swift 5.10 (the macos-14 default) cannot
    # parse, so an older image fails before compiling anything.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundle
        run: scripts/build-app.sh
